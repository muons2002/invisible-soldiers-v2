<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- التدرجات والألوان -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#12192c"/>
      <stop offset="60%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- تأثير التوهج الضوئي -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- الخلفية الداكنة -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- شبكة الديكور التقنية المخفية -->
  <g opacity="0.04" stroke="#00c6ff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- الإطار الخارجي السينمائي -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#202433" stroke-width="3"/>
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#00c6ff" stroke-width="1" opacity="0.3"/>

  <!-- أيقونة التشغيل المركزية المتوهجة -->
  <circle cx="600" cy="200" r="65" fill="#141722" stroke="#00c6ff" stroke-width="3" filter="url(#glow)"/>
  <polygon points="590,170 625,200 590,230" fill="url(#neonText)"/>

  <!-- العنوان الرئيسي: جنود الخفاء TV -->
  <text x="600" y="330" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="62" font-weight="900" fill="url(#neonText)" text-anchor="middle" filter="url(#glow)">
    جنود الخفاء TV
  </text>

  <!-- الوصف: منصة البث المباشر -->
  <text x="600" y="395" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.95">
    منصة البث المباشر السينمائية
  </text>

  <!-- السطر الفرعي -->
  <text x="600" y="445" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="20" fill="#8a90a3" text-anchor="middle">
    مشغل متكامل لمتابعة البث المباشر والقنوات الرياضية والترفيهية بجودات متعددة
  </text>

  <!-- شارات العرض المميزة (Badges) -->
  <!-- 1. LIVE -->
  <g transform="translate(410, 495)">
    <rect width="100" height="38" rx="19" fill="#1e1015" stroke="#ff4757" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#ff4757" filter="url(#glow)"/>
    <text x="38" y="24" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff4757">LIVE</text>
  </g>

  <!-- 2. CINEMA MODE -->
  <g transform="translate(525, 495)">
    <rect width="140" height="38" rx="19" fill="url(#badgeGrad)"/>
    <text x="70" y="24" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CINEMA MODE</text>
  </g>

  <!-- 3. FULL HD 1080P -->
  <g transform="translate(680, 495)">
    <rect width="110" height="38" rx="19" fill="#14161f" stroke="#00c6ff" stroke-width="1"/>
    <text x="55" y="24" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00c6ff" text-anchor="middle">1080p FHD</text>
  </g>
</svg>
